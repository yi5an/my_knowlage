services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,postgres,redis,backend,frontend,paddleocr}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,postgres,redis,backend,frontend,paddleocr}
      YOUTUBE_VISUAL_ANALYSIS_ENABLED: ${YOUTUBE_VISUAL_ANALYSIS_ENABLED:-false}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://paddleocr:8866}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowpilot
      POSTGRES_USER: knowpilot
      POSTGRES_PASSWORD: knowpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  paddleocr:
    build:
      context: ./deploy/paddleocr-service
    profiles:
      - ocr
    expose:
      - "8866"
    environment:
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-ch}

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
