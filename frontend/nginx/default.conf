# nginx config for serving the built SPA and reverse-proxying the API.
# The frontend's API client uses same-origin "/api/v1", so all API traffic
# is routed to the backend container over the compose network.

# Connection upgrade header for WebSocket / SSE (some endpoints may use it).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Static SPA assets.
    root /usr/share/nginx/html;
    index index.html;

    # gzip text responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/rss+xml text/javascript image/svg+xml;

    # Reverse proxy: /api/* -> backend:8010
    location /api/ {
        proxy_pass         http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # The deep-research / import endpoints can stream for a while.
        proxy_buffering    off;
        client_max_body_size 100m;
    }

    # Long-lived cache for hashed static assets.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
