[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowpilot-backend"
version = "0.1.0"
description = "KnowPilot FastAPI backend bootstrap"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.111,<1.0",
  "openpyxl>=3.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "youtube-transcript-api>=0.6.2,<1.0",
  "google-api-python-client>=2.130,<3.0",
  "isodate>=0.6,<1.0",
  "openai>=1.30,<2.0",
  # YouTube GVS requests started requiring the newer extractor behavior in
  # August 2026; older releases can list formats but fail with HTTP 403.
  "yt-dlp[default]>=2026.08.19,<2027.0",
  "Pillow>=10.0,<12.0",
  "imagehash>=4.3,<5.0",
  # Investment information system: real HTTP data sources (SEC / RSS / BLS / FRED).
  # feedparser parses RSS/Atom; httpx is also used by the test client, but it is a
  # production dependency now because fetchers hit real endpoints at runtime.
  "feedparser>=6.0,<7.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<9.0",
  "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
