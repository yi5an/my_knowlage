# Production deployment for KnowPilot.
#
# Architecture:
#   frontend (nginx)  :80  -> serves SPA, reverse-proxies /api -> backend:8010
#   backend  (uvicorn)      -> runs FastAPI app + schedulers (YouTube poll, task worker)
#
# Database: reuses the existing Postgres on the host (172.16.28.250:5432),
#           configured via DATABASE_URL in .env. No postgres/redis containers here.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: knowpilot-backend
    env_file:
      - .env
    environment:
      # YouTube/Google APIs are not directly reachable from the server network.
      # Route backend HTTP clients through the verified LAN proxy. Do not use
      # host.docker.internal here: the host proxy binds to loopback in
      # production, which is unreachable from containers.
      # Keep production network-critical endpoints out of the legacy .env key
      # names. env_file may still contain old LLM_BASE_URL / NO_PROXY values;
      # these explicit container envs intentionally override them on every
      # redeploy.
      YOUTUBE_PROXY_URL: ${KNOWPILOT_PROD_YOUTUBE_PROXY_URL:-http://192.168.1.12:7892}
      HTTP_PROXY: ${KNOWPILOT_PROD_HTTP_PROXY:-http://192.168.1.12:7892}
      HTTPS_PROXY: ${KNOWPILOT_PROD_HTTPS_PROXY:-http://192.168.1.12:7892}
      ALL_PROXY: ${KNOWPILOT_PROD_ALL_PROXY:-http://192.168.1.12:7892}
      NO_PROXY: ${KNOWPILOT_PROD_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,172.16.28.250,172.16.0.0/12,10.0.0.0/8,192.168.1.12,192.168.0.0/16,backend,frontend,postgres,redis,museum_pg,tavily-proxy,paddleocr,asr-nano,knowpilot-asr-nano}
      http_proxy: ${KNOWPILOT_PROD_HTTP_PROXY:-http://192.168.1.12:7892}
      https_proxy: ${KNOWPILOT_PROD_HTTPS_PROXY:-http://192.168.1.12:7892}
      all_proxy: ${KNOWPILOT_PROD_ALL_PROXY:-http://192.168.1.12:7892}
      no_proxy: ${KNOWPILOT_PROD_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,172.16.28.250,172.16.0.0/12,10.0.0.0/8,192.168.1.12,192.168.0.0/16,backend,frontend,postgres,redis,museum_pg,tavily-proxy,paddleocr,asr-nano,knowpilot-asr-nano}
      LLM_BASE_URL: ${KNOWPILOT_PROD_LLM_BASE_URL:-http://192.168.1.12:8317/v1}
      LLM_MODEL: ${KNOWPILOT_PROD_LLM_MODEL:-glm-5.2}
      LLM_TIMEOUT_SECONDS: ${KNOWPILOT_PROD_LLM_TIMEOUT_SECONDS:-300}
      GLM_ASR_BASE_URL: ${KNOWPILOT_PROD_ASR_BASE_URL:-http://asr-nano:8052/v1}
      GLM_ASR_MODEL: ${KNOWPILOT_PROD_ASR_MODEL:-fun-asr-nano}
      YOUTUBE_VISUAL_ANALYSIS_ENABLED: ${YOUTUBE_VISUAL_ANALYSIS_ENABLED:-false}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://paddleocr:8866}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_storage:/app/storage
    # Bind to loopback only for direct debugging; nginx reaches it via the
    # compose network using the service name.
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: knowpilot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  paddleocr:
    build:
      context: ./deploy/paddleocr-service
    container_name: knowpilot-paddleocr
    profiles:
      - ocr
    expose:
      - "8866"
    environment:
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-ch}
    restart: unless-stopped

volumes:
  backend_storage:
