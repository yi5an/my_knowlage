# Production deployment for KnowPilot.
#
# Architecture:
#   frontend (nginx)  :80  -> serves SPA, reverse-proxies /api -> backend:8010
#   backend  (uvicorn)      -> runs FastAPI app + schedulers (YouTube poll, task worker)
#
# Database: reuses the existing Postgres on the host (172.16.28.250:5432),
#           configured via DATABASE_URL in .env. No postgres/redis containers here.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: knowpilot-backend
    env_file:
      - .env
    environment:
      # YouTube/Google APIs are not directly reachable from the server network.
      # Route backend HTTP clients through the reachable mihomo service on the
      # compose network. The old LAN address was a stale workstation endpoint.
      # Keep production network-critical endpoints out of the legacy .env key
      # names. env_file may still contain old LLM_BASE_URL / NO_PROXY values;
      # these explicit container envs intentionally override them on every
      # redeploy.
      YOUTUBE_PROXY_URL: ${KNOWPILOT_PROD_YOUTUBE_PROXY_URL:-http://mihomo:7890}
      HTTP_PROXY: ${KNOWPILOT_PROD_HTTP_PROXY:-http://mihomo:7890}
      HTTPS_PROXY: ${KNOWPILOT_PROD_HTTPS_PROXY:-http://mihomo:7890}
      ALL_PROXY: ${KNOWPILOT_PROD_ALL_PROXY:-http://mihomo:7890}
      NO_PROXY: ${KNOWPILOT_PROD_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,172.16.28.250,172.16.0.0/12,10.0.0.0/8,192.168.1.12,192.168.0.0/16,backend,frontend,postgres,redis,museum_pg,tavily-proxy,paddleocr,asr-nano,knowpilot-asr-nano,mihomo}
      http_proxy: ${KNOWPILOT_PROD_HTTP_PROXY:-http://mihomo:7890}
      https_proxy: ${KNOWPILOT_PROD_HTTPS_PROXY:-http://mihomo:7890}
      all_proxy: ${KNOWPILOT_PROD_ALL_PROXY:-http://mihomo:7890}
      no_proxy: ${KNOWPILOT_PROD_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,172.16.28.250,172.16.0.0/12,10.0.0.0/8,192.168.1.12,192.168.0.0/16,backend,frontend,postgres,redis,museum_pg,tavily-proxy,paddleocr,asr-nano,knowpilot-asr-nano,mihomo}
      LLM_BASE_URL: ${KNOWPILOT_PROD_LLM_BASE_URL:-http://192.168.1.12:8317/v1}
      LLM_MODEL: ${KNOWPILOT_PROD_LLM_MODEL:-glm-5.2}
      LLM_TIMEOUT_SECONDS: ${KNOWPILOT_PROD_LLM_TIMEOUT_SECONDS:-300}
      GLM_ASR_BASE_URL: ${KNOWPILOT_PROD_ASR_BASE_URL:-http://asr-nano:8052/v1}
      GLM_ASR_MODEL: ${KNOWPILOT_PROD_ASR_MODEL:-fun-asr-nano}
      YOUTUBE_VISUAL_ANALYSIS_ENABLED: ${KNOWPILOT_PROD_YOUTUBE_VISUAL_ANALYSIS_ENABLED:-true}
      # Persisted browser-session Cookie text is written only by the backend
      # through Settings → YouTube 访问 Cookie. Do not place its value in .env.
      YOUTUBE_COOKIES_FILE: /app/private/youtube-cookies.txt
      OCR_BASE_URL: ${KNOWPILOT_PROD_OCR_BASE_URL:-http://host.docker.internal:8126}
      YOUTUBE_LOCAL_VIDEO_DIR: ${KNOWPILOT_PROD_YOUTUBE_LOCAL_VIDEO_DIR:-/mnt/knowpilot-nas/youtube}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_storage:/app/storage
      - backend_private:/app/private
      - /mnt/knowpilot-nas/youtube:/mnt/knowpilot-nas/youtube
    # Bind to loopback only for direct debugging; nginx reaches it via the
    # compose network using the service name.
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: knowpilot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  paddleocr:
    build:
      context: ./deploy/paddleocr-service
    container_name: knowpilot-paddleocr
    profiles:
      - ocr
    expose:
      - "8866"
    environment:
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-ch}
    restart: unless-stopped

  x-collector:
    build:
      context: ./tools/x-collector
    container_name: knowpilot-x-collector
    environment:
      KNOWPILOT_URL: http://backend:8010
      X_COLLECTOR_ID: prod-server
      # x.com is only reachable via the mihomo proxy on the compose network.
      X_COLLECTOR_PROXY_SERVER: http://mihomo:7890
      # Headful inside the container's xvfb: X blocks headless fingerprints.
      X_COLLECTOR_HEADLESS: "0"
    depends_on:
      - backend
    init: true
    restart: unless-stopped

volumes:
  backend_storage:
  backend_private:
